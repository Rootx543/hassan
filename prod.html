<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<title>PhotoBook — Visual Directory</title>
<style>
:root{
  --bg:#0d1017; --card:#171c26; --card2:#1e2531;
  --line:#262e3c; --line2:#333f52;
  --txt:#e9eef5; --dim:#8b98ab;
  --acc:#4f8cff; --danger:#ff6b6b;
  --grad:linear-gradient(135deg,#4f8cff,#8a5cf6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;color:var(--txt);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(110px + env(safe-area-inset-bottom));
  background:
    radial-gradient(1100px 550px at 85% -10%, #1a2340 0%, transparent 60%),
    radial-gradient(800px 450px at -10% 0%, #251a3d 0%, transparent 55%),
    var(--bg);
}
header{
  position:sticky;top:0;z-index:10;
  background:#0d1017d9;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:12px 14px 10px;
}
.row{display:flex;gap:8px;align-items:center}
h1{
  font-size:19px;margin:0 auto 10px 0;letter-spacing:.3px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
input,textarea,button,select{font:inherit;color:var(--txt)}
#search{
  flex:1;min-width:0;padding:12px 14px;border-radius:14px;
  border:1px solid var(--line);background:var(--card);outline:none;
  transition:border-color .15s, box-shadow .15s;
}
#search:focus{border-color:var(--acc);box-shadow:0 0 0 3px #4f8cff22}
select{
  padding:12px 10px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);outline:none;
}
.btn{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;cursor:pointer;transition:transform .1s, background .15s, border-color .15s;
}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--grad);border:none;color:#fff;font-weight:600}
.btn.danger{background:#3a1d1d;border-color:#5b2a2a;color:#ff9b9b}

/* header menu */
.menu{position:relative}
.menu summary{list-style:none;user-select:none}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{
  position:absolute;right:0;top:calc(100% + 8px);z-index:20;min-width:220px;
  background:var(--card2);border:1px solid var(--line2);border-radius:14px;
  padding:6px;box-shadow:0 12px 40px #000a;
  display:flex;flex-direction:column;
}
.menu-pop button{
  background:none;border:none;text-align:left;padding:11px 12px;
  border-radius:9px;cursor:pointer;color:var(--txt);
}
.menu-pop button:hover{background:#ffffff10}

/* chips */
#chips{
  display:flex;gap:8px;overflow-x:auto;padding:12px 14px 2px;
  scrollbar-width:none;
}
#chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:999px;font-size:13px;
  background:var(--card);border:1px solid var(--line);color:var(--dim);cursor:pointer;
  transition:all .15s;
}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}

#count{color:var(--dim);font-size:13px;padding:10px 16px 4px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:8px 14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  overflow:hidden;cursor:pointer;position:relative;
  transition:transform .15s, border-color .15s, box-shadow .15s;
}
.card:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 10px 30px #0007}
.card:active{transform:scale(.97)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#0c0f13}
.star{
  position:absolute;top:8px;right:8px;font-size:14px;
  background:#0009;backdrop-filter:blur(6px);
  padding:4px 8px;border-radius:999px;color:#ffd166;
}
.meta{padding:9px 12px 11px}
.nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{color:var(--acc);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{color:var(--dim);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--dim);text-align:center;padding:70px 20px;font-size:15px}
.empty .big{font-size:44px;display:block;margin-bottom:10px}

#fab{
  position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));
  width:62px;height:62px;border-radius:50%;background:var(--grad);color:#fff;
  border:none;font-size:32px;line-height:1;cursor:pointer;
  box-shadow:0 10px 28px #4f8cff55;transition:transform .15s;
}
#fab:active{transform:scale(.92)}

dialog{
  border:none;background:var(--card);color:var(--txt);
  border-radius:22px;padding:0;width:min(560px,94vw);max-height:92vh;
  box-shadow:0 24px 70px #000c;
}
dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}
dialog[open]{animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.sheet{padding:18px;display:flex;flex-direction:column;gap:13px;overflow:auto;max-height:92vh}
.sheet h2{margin:0;font-size:18px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}
.field input,.field textarea{
  width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:#12161f;outline:none;transition:border-color .15s;
}
.field input:focus,.field textarea:focus{border-color:var(--acc)}
#preview,#bigimg{width:100%;border-radius:14px;background:#0c0f13;object-fit:contain;max-height:46vh;display:block}
#preview.loading{animation:shimmer 1.1s infinite}
@keyframes shimmer{0%,100%{opacity:.35}50%{opacity:.8}}
.grow{flex:1}
.hide{display:none!important}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);z-index:50;
  background:var(--card2);border:1px solid var(--line2);color:var(--txt);
  padding:11px 18px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 8px 30px #000a;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="row"><h1>◈ PhotoBook</h1>
    <details class="menu" id="menu">
      <summary class="btn">⋯</summary>
      <div class="menu-pop" id="menuPop">
        <button id="exportBtn">⬇&nbsp; Backup (JSON + photos)</button>
        <button id="csvBtn">⬇&nbsp; Export list (CSV)</button>
        <button id="importBtn">⬆&nbsp; Restore backup</button>
      </div>
    </details>
  </div>
  <div class="row">
    <input id="search" type="search" placeholder="Search name, code or #tag…" autocomplete="off">
    <select id="sort">
      <option value="new">Newest</option>
      <option value="old">Oldest</option>
      <option value="name">Name A–Z</option>
    </select>
  </div>
</header>

<div id="chips"></div>
<div id="count"></div>
<div id="grid"></div>
<div class="empty hide" id="empty">
  <span class="big">📸</span>
  No entries yet.<br>Tap ＋ to add your first photo card.
</div>

<button id="fab" aria-label="Add entry">+</button>
<div id="toast"></div>

<!-- Add / edit -->
<dialog id="editDlg"><form method="dialog" class="sheet" id="editForm">
  <h2 id="editTitle">New entry</h2>
  <img id="preview" alt="">
  <div class="row">
    <button type="button" class="btn grow" id="camBtn">📷 Camera</button>
    <button type="button" class="btn grow" id="galBtn">🖼 Gallery</button>
  </div>
  <div class="field"><label>Name</label><input id="fName" placeholder="e.g. Ahmed Ali" autocomplete="off"></div>
  <div class="field"><label>Code / Number</label><input id="fCode" placeholder="e.g. 10245" autocomplete="off"></div>
  <div class="field"><label>Tags (comma separated)</label><input id="fTags" placeholder="e.g. family, work, vip" autocomplete="off"></div>
  <div class="field"><label>Note (optional)</label><textarea id="fNote" rows="2"></textarea></div>
  <label style="display:flex;gap:8px;align-items:center;color:var(--dim);font-size:14px;cursor:pointer">
    <input type="checkbox" id="fFav" style="width:18px;height:18px;accent-color:var(--acc)"> Mark as favorite ★
  </label>
  <div class="row">
    <button type="button" class="btn grow" id="cancelBtn">Cancel</button>
    <button type="button" class="btn primary grow" id="saveBtn">Save</button>
  </div>
</form></dialog>

<!-- Detail -->
<dialog id="viewDlg"><div class="sheet">
  <img id="bigimg" alt="">
  <h2 id="vName"></h2>
  <div style="color:var(--acc);font-size:18px" id="vCode"></div>
  <div style="color:var(--dim);font-size:13px" id="vTags"></div>
  <div style="color:var(--dim);white-space:pre-wrap" id="vNote"></div>
  <div style="color:var(--dim);font-size:12px" id="vDate"></div>
  <div class="row">
    <button class="btn grow" id="starThis">☆ Favorite</button>
    <button class="btn grow" id="shareThis">↗ Share</button>
  </div>
  <div class="row">
    <button class="btn grow" id="closeView">Close</button>
    <button class="btn grow" id="editThis">Edit</button>
    <button class="btn danger grow" id="delThis">Delete</button>
  </div>
</div></dialog>

<!-- Confirm -->
<dialog id="confirmDlg"><div class="sheet">
  <h2 id="cfTitle">Are you sure?</h2>
  <p id="cfMsg" style="color:var(--dim);margin:0"></p>
  <div class="row">
    <button class="btn grow" id="cfNo">Cancel</button>
    <button class="btn danger grow" id="cfYes">Confirm</button>
  </div>
</div></dialog>

<input type="file" id="camIn" accept="image/*" capture="environment" class="hide">
<input type="file" id="galIn" accept="image/*" class="hide">
<input type="file" id="jsonIn" accept="application/json,.json" class="hide">

<script>
const $ = s => document.querySelector(s);
let db, items = [], urls = [], pending = null;
let editingId = null, currentId = null, activeTag = 'all', sortMode = 'new';

/* ---------- storage ---------- */
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('photobook', 1);   // same DB — old data loads unchanged
    r.onupgradeneeded = () => {
      const s = r.result.createObjectStore('items', {keyPath:'id'});
      s.createIndex('code','code'); s.createIndex('name','name');
    };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
const store = m => db.transaction('items', m).objectStore('items');
const wrap  = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const norm  = i => ({name:'', code:'', note:'', tags:[], fav:false, created:Date.now(), ...i});

/* ---------- ui helpers ---------- */
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2200);
}
function confirmDlg(msg, yes='Confirm', title='Are you sure?'){
  return new Promise(res=>{
    const dlg = $('#confirmDlg'); let done = false;
    const fin = v => { if(done) return; done = true; res(v); };
    $('#cfTitle').textContent = title; $('#cfMsg').textContent = msg; $('#cfYes').textContent = yes;
    $('#cfYes').onclick = () => { dlg.close(); fin(true); };
    $('#cfNo').onclick  = () => { dlg.close(); fin(false); };
    dlg.oncancel = () => fin(false);
    dlg.onclose  = () => fin(false);
    dlg.showModal();
  });
}
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* close dialogs by tapping the dimmed backdrop */
for (const d of document.querySelectorAll('dialog'))
  d.addEventListener('click', e => { if (e.target === d) d.close(); });

/* ---------- image handling ---------- */
async function shrink(bmp, max, q){
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
async function processFile(file){
  const bmp = await createImageBitmap(file, {imageOrientation:'from-image'});
  const full  = await shrink(bmp, 1600, 0.85);
  const thumb = await shrink(bmp, 400, 0.7);
  bmp.close();
  return {full, thumb};
}

/* ---------- rendering ---------- */
function clearUrls(){ urls.forEach(URL.revokeObjectURL); urls = []; }
function url(b){ const u = URL.createObjectURL(b); urls.push(u); return u; }

function renderChips(){
  const tags = [...new Set(items.flatMap(i => i.tags))].sort();
  const w = $('#chips'); w.innerHTML = '';
  const mk = (key, label) => {
    const b = document.createElement('button');
    b.className = 'chip' + (activeTag === key ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { activeTag = key; render(); };
    w.appendChild(b);
  };
  mk('all', 'All');
  if (items.some(i => i.fav)) mk('fav', '★ Favorites');
  tags.forEach(t => mk(t, '#' + t));
}

function render(){
  clearUrls();
  renderChips();
  const q = $('#search').value.trim().toLowerCase();
  const list = items.filter(i => {
    const hitQ = !q || i.name.toLowerCase().includes(q) || i.code.toLowerCase().includes(q)
                 || i.tags.some(t => t.includes(q.replace(/^#/,'')));
    const hitT = activeTag === 'all' || (activeTag === 'fav' ? i.fav : i.tags.includes(activeTag));
    return hitQ && hitT;
  }).sort((a,b) =>
    sortMode === 'name' ? a.name.localeCompare(b.name) :
    sortMode === 'old'  ? a.created - b.created :
                          b.created - a.created);

  const favs = items.filter(i => i.fav).length;
  $('#count').textContent =
    (q || activeTag !== 'all' ? `${list.length} of ${items.length}` : `${items.length} entr${items.length===1?'y':'ies'}`)
    + (favs ? ` · ★ ${favs}` : '');
  $('#empty').classList.toggle('hide', items.length !== 0);

  $('#grid').innerHTML = '';
  for (const it of list){
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `
      ${it.fav ? '<div class="star">★</div>' : ''}
      <img src="${url(it.thumb)}" alt="" loading="lazy">
      <div class="meta">
        <div class="nm">${esc(it.name || '—')}</div>
        <div class="cd">${esc(it.code)}</div>
        ${it.tags.length ? `<div class="tg">${it.tags.slice(0,3).map(t=>'#'+esc(t)).join(' ')}</div>` : ''}
      </div>`;
    d.onclick = () => openView(it.id);
    $('#grid').appendChild(d);
  }
}

async function reload(){ items = (await wrap(store('readonly').getAll())).map(norm); render(); }

/* ---------- add / edit ---------- */
function openEdit(item){
  editingId = item ? item.id : null;
  pending = null;
  $('#editTitle').textContent = item ? 'Edit entry' : 'New entry';
  $('#fName').value = item ? item.name : '';
  $('#fCode').value = item ? item.code : '';
  $('#fTags').value = item ? item.tags.join(', ') : '';
  $('#fNote').value = item ? item.note : '';
  $('#fFav').checked = item ? !!item.fav : false;
  $('#preview').src = item ? url(item.full) : '';
  $('#editDlg').showModal();
}
$('#fab').onclick = () => openEdit(null);
$('#camBtn').onclick = () => $('#camIn').click();
$('#galBtn').onclick = () => $('#galIn').click();
$('#cancelBtn').onclick = () => $('#editDlg').close();

for (const id of ['camIn','galIn']){
  $('#'+id).onchange = async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    $('#preview').classList.add('loading');
    try{
      pending = await processFile(f);
      $('#preview').src = url(pending.full);
    }catch{ toast('Could not read that image.'); }
    $('#preview').classList.remove('loading');
  };
}

$('#saveBtn').onclick = async () => {
  const name = $('#fName').value.trim(), code = $('#fCode').value.trim();
  const tags = [...new Set($('#fTags').value.split(',')
    .map(t => t.trim().toLowerCase().replace(/^#+/,'')).filter(Boolean))].slice(0,6);
  if (!name && !code) return toast('Enter a name or a code.');
  if (!editingId && !pending) return toast('Take or choose a photo first.');

  if (code && items.some(i => i.id !== editingId && i.code && i.code.toLowerCase() === code.toLowerCase())){
    if (!await confirmDlg(`Another entry already uses code "${code}". Save anyway?`, 'Save anyway', 'Duplicate code')) return;
  }

  let rec;
  if (editingId){
    rec = {...items.find(i => i.id === editingId), name, code, tags, note:$('#fNote').value.trim(), fav:$('#fFav').checked};
    if (pending){ rec.full = pending.full; rec.thumb = pending.thumb; }
  } else {
    rec = {id: crypto.randomUUID(), name, code, tags, note:$('#fNote').value.trim(),
           fav:$('#fFav').checked, full: pending.full, thumb: pending.thumb, created: Date.now()};
  }
  await wrap(store('readwrite').put(rec));
  $('#editDlg').close();
  await reload();
  toast(editingId ? 'Entry updated.' : 'Entry added.');
};

/* ---------- view ---------- */
function updateStarBtn(){
  const it = items.find(i => i.id === currentId);
  $('#starThis').textContent = it && it.fav ? '★ Favorited' : '☆ Favorite';
}
function openView(id){
  const it = items.find(i => i.id === id); if (!it) return;
  currentId = id;
  $('#bigimg').src = url(it.full);
  $('#vName').textContent = it.name || '—';
  $('#vCode').textContent = it.code ? 'Code: ' + it.code : '';
  $('#vTags').textContent = it.tags.map(t => '#' + t).join('  ');
  $('#vNote').textContent = it.note || '';
  $('#vDate').textContent = 'Added ' + new Date(it.created).toLocaleString();
  updateStarBtn();
  $('#viewDlg').showModal();
}
$('#closeView').onclick = () => $('#viewDlg').close();
$('#editThis').onclick = () => { $('#viewDlg').close(); openEdit(items.find(i => i.id === currentId)); };
$('#starThis').onclick = async () => {
  const it = items.find(i => i.id === currentId); if (!it) return;
  it.fav = !it.fav;
  await wrap(store('readwrite').put(it));
  updateStarBtn(); render();
};
$('#shareThis').onclick = async () => {
  const it = items.find(i => i.id === currentId); if (!it) return;
  const text = [it.name, it.code && 'Code: ' + it.code, it.note,
                it.tags.length && it.tags.map(t=>'#'+t).join(' ')].filter(Boolean).join('\n');
  try{ await navigator.share({title:'PhotoBook', text}); }
  catch{
    try{ await navigator.clipboard.writeText(text); toast('Copied to clipboard.'); }
    catch{ toast('Sharing not supported here.'); }
  }
};
$('#delThis').onclick = async () => {
  if (!await confirmDlg('Delete this entry permanently?', 'Delete')) return;
  await wrap(store('readwrite').delete(currentId));
  $('#viewDlg').close(); await reload();
  toast('Entry deleted.');
};

/* ---------- backup / restore ---------- */
const b64   = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
const unb64 = async d => (await fetch(d)).blob();
const download = (blob, name) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

$('#exportBtn').onclick = async () => {
  const out = [];
  for (const it of items) out.push({...it, full: await b64(it.full), thumb: await b64(it.thumb)});
  download(new Blob([JSON.stringify({v:2, items:out})], {type:'application/json'}),
           'photobook-backup-' + new Date().toISOString().slice(0,10) + '.json');
  toast('Backup downloaded.');
};
$('#csvBtn').onclick = () => {
  const rows = [['name','code','tags','note','added'].join(',')];
  for (const it of items)
    rows.push([it.name, it.code, it.tags.join(' '), it.note, new Date(it.created).toISOString()]
      .map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  download(new Blob([rows.join('\n')], {type:'text/csv'}), 'photobook-list.csv');
  toast('CSV exported.');
};
$('#importBtn').onclick = () => $('#jsonIn').click();
$('#jsonIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try{
    const data = JSON.parse(await f.text());
    for (const it of data.items)
      await wrap(store('readwrite').put(norm({...it, full: await unb64(it.full), thumb: await unb64(it.thumb)})));
    await reload(); toast('Restored ' + data.items.length + ' entries.');
  }catch{ toast('Invalid backup file.'); }
};

/* ---------- menu ---------- */
$('#menuPop').onclick = () => $('#menu').open = false;
document.addEventListener('click', e => { if ($('#menu').open && !$('#menu').contains(e.target)) $('#menu').open = false; });

/* ---------- favicon ---------- */
(() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,64,64); gr.addColorStop(0,'#4f8cff'); gr.addColorStop(1,'#8a5cf6');
  g.fillStyle = gr; g.beginPath(); g.roundRect(0,0,64,64,16); g.fill();
  g.fillStyle = '#fff'; g.font = 'bold 34px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('◈', 32, 35);
  const l = document.createElement('link'); l.rel = 'icon'; l.href = c.toDataURL();
  document.head.appendChild(l);
})();

/* ---------- boot ---------- */
$('#search').oninput = render;
$('#sort').onchange = e => { sortMode = e.target.value; render(); };
(async () => {
  if (navigator.storage?.persist) await navigator.storage.persist(); // ask OS to never auto-clear
  db = await openDB();
  await reload();
})();
</script>
</body>
</html>
