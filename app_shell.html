<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Camion Pick List</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --line:#e2e8f0; --accent:#0369a1; --accent-soft:#e0f2fe; --ok:#15803d; --ok-soft:#dcfce7;
  --warn:#b45309; --warn-soft:#fef3c7; --danger:#b91c1c; --danger-soft:#fee2e2;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink);
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;background:var(--card);
  border-bottom:1px solid var(--line); padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-size:17px;font-weight:500;letter-spacing:-.01em;flex:1;min-width:0}
.logo small{display:block;font-size:12px;color:var(--ink3);font-weight:400}
.btn{
  padding:9px 14px;border-radius:10px;background:var(--accent);
  color:#fff;font-size:14px;font-weight:500;white-space:nowrap;
}
.btn:active{opacity:.85}
.btn.ghost{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}

/* ---------- progress ---------- */
.progwrap{margin-top:10px;display:none}
.progwrap.on{display:block}
.progtop{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:5px}
.progtop b{color:var(--ink);font-weight:500}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .25s}

/* ---------- layout ---------- */
main{padding:14px;max-width:820px;margin:0 auto}

/* ---------- dropzone ---------- */
.drop{
  border:2px dashed var(--line);border-radius:16px;background:var(--card);
  padding:34px 20px;text-align:center;transition:.15s;
}
.drop.hot{border-color:var(--accent);background:var(--accent-soft)}
.drop .ic{font-size:40px;line-height:1}
.drop h2{margin:12px 0 4px;font-size:16px;font-weight:500}
.drop p{margin:0 0 16px;font-size:13.5px;color:var(--ink2)}
.dropbtns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

/* ---------- status ---------- */
.status{
  display:none;margin-top:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px;box-shadow:var(--shadow);
}
.status.on{display:block}
.srow{display:flex;align-items:center;gap:10px;font-size:14px}
.spin{
  width:17px;height:17px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;flex:none
}
@keyframes sp{to{transform:rotate(360deg)}}
.sbar{height:6px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.sbar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.shint{font-size:12.5px;color:var(--ink3);margin-top:7px}

/* ---------- toolbar ---------- */
.tools{display:none;gap:8px;margin:14px 0 10px;flex-wrap:wrap;align-items:center}
.tools.on{display:flex}
.chip{
  padding:7px 12px;border-radius:99px;border:1px solid var(--line);
  background:var(--card);font-size:13px;color:var(--ink2);font-weight:400
}
.chip.act{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.spacer{flex:1}

/* ---------- item cards ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.card{
  display:flex;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:11px;box-shadow:var(--shadow);
  transition:.15s;align-items:flex-start;
}
.card.done{background:var(--ok-soft);border-color:#bbf7d0}
.card.done .pic{opacity:.5}
.card.done .nm,.card.done .cd{text-decoration:line-through;color:var(--ink3)}
.pic{
  width:96px;height:96px;flex:none;border-radius:11px;overflow:hidden;
  background:var(--bg);display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);cursor:zoom-in;position:relative
}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .no{font-size:11px;color:var(--ink3);text-align:center;padding:6px;line-height:1.3}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.cd{font-size:19px;font-weight:500;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.nm{font-size:13.5px;color:var(--ink2);word-break:break-word}
.nm.faint{color:var(--ink3);font-style:italic}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:1px}
.tag{
  font-size:11.5px;padding:2.5px 8px;border-radius:99px;
  background:var(--bg);color:var(--ink2);border:1px solid var(--line)
}
.tag.q{background:var(--accent-soft);color:#075985;border-color:#bae6fd;font-weight:500;font-size:13px}
.tag.w{background:var(--warn-soft);color:var(--warn);border-color:#fde68a}
.tag.g{background:var(--ok-soft);color:var(--ok);border-color:#bbf7d0}
.act{display:flex;flex-direction:column;gap:7px;align-items:center;flex:none}
.tick{
  width:46px;height:46px;border-radius:12px;border:2px solid var(--line);
  background:var(--card);font-size:21px;color:var(--ink3);
  display:flex;align-items:center;justify-content:center;transition:.12s
}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tick:active{transform:scale(.94)}
.del{font-size:12px;color:var(--ink3);padding:3px 6px}

/* qty stepper */
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{width:28px;height:28px;background:var(--bg);color:var(--ink2);font-size:15px;line-height:1}
.qty span{min-width:34px;text-align:center;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- section head ---------- */
.sec{font-size:12.5px;font-weight:500;color:var(--ink3);text-transform:uppercase;
  letter-spacing:.05em;margin:18px 0 9px}

/* ---------- add row ---------- */
.addbox{display:none;margin:12px 0;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.addbox.on{display:block}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);min-width:0}
.addrow input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.sugg{margin-top:9px;display:flex;flex-direction:column;gap:5px;max-height:270px;overflow:auto}
.sg{display:flex;gap:9px;align-items:center;padding:7px;border-radius:10px;background:var(--bg);cursor:pointer}
.sg:active{background:var(--accent-soft)}
.sg img{width:42px;height:42px;border-radius:8px;object-fit:cover;flex:none}
.sg .t{font-size:14px;font-weight:500}
.sg .s{font-size:12px;color:var(--ink3)}

/* ---------- empty ---------- */
.empty{text-align:center;padding:34px 18px;color:var(--ink3);font-size:14px}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;background:rgba(15,23,42,.93);z-index:200;
  display:none;align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:14px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:78vh;border-radius:12px;object-fit:contain}
.lb .cap{color:#fff;font-size:16px;text-align:center}
.lb .cap b{font-size:22px;display:block;margin-bottom:3px;font-weight:500}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;
  z-index:300;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:420px){
  .pic{width:80px;height:80px}
  .cd{font-size:17px}
  .tick{width:42px;height:42px}
}
@media print{
  header,.tools,.drop,.status,.act,.addbox,.del{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="logo">Camion Pick List<small id="sub">Upload an invoice photo to start</small></div>
    <button class="btn sm ghost" id="bAdd">+ Add</button>
    <button class="btn sm" id="bShot">Scan</button>
  </div>
  <div class="progwrap" id="pw">
    <div class="progtop"><span id="ptxt">0 of 0 collected</span><b id="ppct">0%</b></div>
    <div class="bar"><i id="pbar"></i></div>
  </div>
</header>

<main>
  <div class="drop" id="drop">
    <div class="ic">&#128247;</div>
    <h2>Scan your invoice</h2>
    <p>Take a photo or drop an image &mdash; item codes and quantities<br>are read automatically, no internet needed after first load.</p>
    <div class="dropbtns">
      <button class="btn" id="bCam">Take photo</button>
      <button class="btn ghost" id="bFile">Choose file</button>
    </div>
  </div>

  <div class="status" id="st">
    <div class="srow"><div class="spin"></div><div id="stxt">Reading photo&hellip;</div></div>
    <div class="sbar"><i id="sbar"></i></div>
    <div class="shint" id="shint">First scan loads the reader (~2 MB). Later scans are instant.</div>
  </div>

  <div class="addbox" id="addbox">
    <div class="addrow">
      <input id="q" placeholder="Type a code or product name&hellip;" autocomplete="off">
      <button class="btn" id="bAddGo">Add</button>
    </div>
    <div class="sugg" id="sugg"></div>
  </div>

  <div class="tools" id="tools">
    <button class="chip act" data-f="all">All</button>
    <button class="chip" data-f="todo">To collect</button>
    <button class="chip" data-f="done">Collected</button>
    <div class="spacer"></div>
    <button class="chip" id="bPrint">Print</button>
    <button class="chip" id="bClear">Clear</button>
  </div>

  <div id="out"></div>
</main>

<input type="file" id="fCam" accept="image/*" capture="environment" multiple hidden>
<input type="file" id="fPick" accept="image/*" multiple hidden>

<div class="lb" id="lb"><img id="lbi" alt=""><div class="cap" id="lbc"></div></div>
<div class="toast" id="toast"></div>

<script src="catalog_data.js"></script>
<script src="app.js"></script>
</body>
</html>
