<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<title>Nova AI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  :root{
    --bg:#0b0f19; --panel:#141a2a; --panel2:#1b2237; --line:#26304a;
    --txt:#e8ecf5; --muted:#8b95ad; --accent:#6c8cff; --accent2:#9d7bff;
    --user:#2a3b6e; --bot:#1b2237; --danger:#ff5c72; --ok:#38d39f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* Header */
  header{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top));
    background:linear-gradient(90deg,#141a2a,#171f36);
    border-bottom:1px solid var(--line); position:relative; z-index:20;
  }
  .logo{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px;
  }
  .title{font-weight:700;font-size:16px;line-height:1}
  .subtitle{font-size:11px;color:var(--muted);margin-top:2px}
  .hspace{flex:1}
  .icon-btn{
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer;
    display:grid;place-items:center;
  }
  .icon-btn:active{transform:scale(.94)}
  /* Model bar */
  .modelbar{
    display:flex;gap:8px;align-items:center;padding:8px 12px;
    background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;
    scrollbar-width:none;
  }
  .modelbar::-webkit-scrollbar{display:none}
  select{
    background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:7px 9px;font-size:13px;max-width:60%;
  }
  .chip{
    flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;
  }
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
  /* Chat */
  #chat{
    flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:12px;
    -webkit-overflow-scrolling:touch;
  }
  .msg{max-width:88%;display:flex;gap:8px;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .avatar{
    width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;
    font-size:13px;font-weight:700;
  }
  .avatar.bot{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .avatar.user{background:var(--user);color:#cdd7ff}
  .bubble{
    background:var(--bot);border:1px solid var(--line);border-radius:14px;
    padding:10px 13px;font-size:15px;line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere;
  }
  .msg.user .bubble{background:var(--user);border-color:#33447a}
  .bubble img{max-width:100%;border-radius:10px;margin-top:6px;display:block}
  .bubble audio{margin-top:8px;width:230px;max-width:100%}
  .bubble pre{
    background:#0d1220;border:1px solid var(--line);border-radius:10px;padding:10px;
    overflow-x:auto;font-size:13px;margin:8px 0;
  }
  .bubble code{font-family:ui-monospace,Menlo,Consolas,monospace}
  .bubble p{margin:6px 0}
  .bubble p:first-child{margin-top:0}
  .bubble p:last-child{margin-bottom:0}
  .bubble a{color:var(--accent)}
  .meta{font-size:10px;color:var(--muted);margin-top:5px}
  .tools{display:flex;gap:8px;margin-top:6px}
  .tools button{
    background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 4px;
  }
  .typing{display:flex;gap:4px;padding:4px 2px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  /* Welcome */
  .welcome{text-align:center;color:var(--muted);margin:auto;padding:20px;max-width:340px}
  .welcome h2{color:var(--txt);margin:10px 0 6px}
  .suggest{display:grid;gap:8px;margin-top:18px}
  .suggest div{
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:11px;font-size:14px;color:var(--txt);cursor:pointer;text-align:left;
  }
  /* Input */
  .composer{
    padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
    background:var(--panel);border-top:1px solid var(--line);
  }
  .preview{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .preview .thumb{position:relative}
  .preview img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .preview .x{
    position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border:none;
    width:20px;height:20px;border-radius:50%;font-size:12px;cursor:pointer;
  }
  .inrow{display:flex;align-items:flex-end;gap:8px}
  .inrow textarea{
    flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:18px;padding:11px 14px;font-size:15px;resize:none;max-height:120px;
    line-height:1.4;font-family:inherit;
  }
  .inrow textarea:focus{outline:none;border-color:var(--accent)}
  .send{
    width:44px;height:44px;flex:none;border-radius:50%;border:none;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:18px;
    display:grid;place-items:center;
  }
  .send:disabled{opacity:.5}
  .send:active{transform:scale(.92)}
  /* Drawer */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;
    transition:opacity .2s;
  }
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;width:80%;max-width:320px;background:var(--panel);
    border-right:1px solid var(--line);z-index:41;transform:translateX(-100%);
    transition:transform .25s;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }
  .drawer.open{transform:none}
  .drawer h3{padding:16px 16px 8px;margin:0;font-size:14px;color:var(--muted)}
  .newchat{
    margin:12px 16px;padding:12px;border-radius:12px;border:1px dashed var(--line);
    background:var(--panel2);color:var(--txt);cursor:pointer;font-size:14px;text-align:center;
  }
  .hist{flex:1;overflow-y:auto;padding:0 10px}
  .hist .item{
    padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer;color:var(--txt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;
  }
  .hist .item.active{background:var(--panel2)}
  .hist .item .del{margin-left:auto;color:var(--muted);background:none;border:none;cursor:pointer;font-size:14px}
  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;
    padding:8px 16px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .3s;
    pointer-events:none;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <button class="icon-btn" onclick="toggleDrawer(true)">☰</button>
  <div class="logo">N</div>
  <div>
    <div class="title">Nova AI</div>
    <div class="subtitle" id="statusLine">Powered by Puter · GPT-5.6</div>
  </div>
  <div class="hspace"></div>
  <button class="icon-btn" id="loginBtn" onclick="doAuth()" title="Account">👤</button>
</header>

<div class="modelbar">
  <select id="model">
    <optgroup label="GPT-5.6 (newest)">
      <option value="gpt-5.6-sol">GPT-5.6 Sol (flagship)</option>
      <option value="gpt-5.6-terra">GPT-5.6 Terra (balanced)</option>
      <option value="gpt-5.6-luna" selected>GPT-5.6 Luna (fast)</option>
      <option value="gpt-5.6-sol-pro">GPT-5.6 Sol Pro</option>
    </optgroup>
    <optgroup label="GPT-5.x">
      <option value="gpt-5.5">GPT-5.5</option>
      <option value="gpt-5.4">GPT-5.4</option>
      <option value="gpt-5.4-mini">GPT-5.4 Mini</option>
      <option value="gpt-5.3-chat">GPT-5.3 Chat</option>
    </optgroup>
    <optgroup label="Reasoning / Code">
      <option value="gpt-5.3-codex">GPT-5.3 Codex</option>
      <option value="o3">o3</option>
      <option value="o4-mini">o4-mini</option>
      <option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
    </optgroup>
    <optgroup label="Legacy">
      <option value="gpt-4o">GPT-4o</option>
      <option value="gpt-4o-mini">GPT-4o mini</option>
    </optgroup>
  </select>
  <div class="chip active" id="chipChat" onclick="setMode('chat')">💬 Chat</div>
  <div class="chip" id="chipWeb" onclick="setMode('web')">🌐 Web</div>
  <div class="chip" id="chipImage" onclick="setMode('image')">🎨 Image</div>
</div>

<div id="chat"></div>

<div class="composer">
  <div class="preview" id="preview"></div>
  <div class="inrow">
    <button class="icon-btn" onclick="document.getElementById('file').click()" title="Attach image">📎</button>
    <input type="file" id="file" accept="image/*" hidden onchange="onFile(event)">
    <button class="icon-btn" id="micBtn" onclick="toggleMic()" title="Voice input">🎤</button>
    <textarea id="input" rows="1" placeholder="Message Nova AI…"
      oninput="autoGrow(this)" onkeydown="onKey(event)"></textarea>
    <button class="send" id="sendBtn" onclick="send()">➤</button>
  </div>
</div>

<!-- Drawer -->
<div class="overlay" id="overlay" onclick="toggleDrawer(false)"></div>
<div class="drawer" id="drawer">
  <div class="newchat" onclick="newChat()">＋ New chat</div>
  <h3>History</h3>
  <div class="hist" id="hist"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- State ---------- */
let mode = 'chat';                 // chat | web | image
let attachedImage = null;          // {dataUrl}
let isStreaming = false;
let convos = load('nova_convos', {});   // {id:{title, messages:[]}}
let currentId = null;

/* ---------- Storage helpers ---------- */
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function save(){localStorage.setItem('nova_convos', JSON.stringify(convos))}

/* ---------- Convo management ---------- */
function newChat(){
  currentId = 'c'+Date.now();
  convos[currentId] = {title:'New chat', messages:[]};
  save(); renderHist(); renderChat(); toggleDrawer(false);
}
function switchChat(id){ currentId=id; renderHist(); renderChat(); toggleDrawer(false); }
function delChat(id,e){
  e.stopPropagation();
  delete convos[id]; save();
  if(currentId===id){ const keys=Object.keys(convos); currentId=keys[0]||null; if(!currentId) newChat(); }
  renderHist(); renderChat();
}
function curMsgs(){ return convos[currentId]?convos[currentId].messages:[] }

/* ---------- Rendering ---------- */
function renderHist(){
  const h=document.getElementById('hist'); h.innerHTML='';
  Object.keys(convos).reverse().forEach(id=>{
    const c=convos[id];
    const el=document.createElement('div');
    el.className='item'+(id===currentId?' active':'');
    el.onclick=()=>switchChat(id);
    el.innerHTML=`<span>💬</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(c.title)}</span>
      <button class="del" onclick="delChat('${id}',event)">🗑</button>`;
    h.appendChild(el);
  });
}
function renderChat(){
  const box=document.getElementById('chat'); box.innerHTML='';
  const msgs=curMsgs();
  if(msgs.length===0){ showWelcome(box); return; }
  msgs.forEach(m=>addBubble(m.role, m.content, m.image, m.audio, false));
  scrollDown();
}
function showWelcome(box){
  box.innerHTML=`<div class="welcome">
    <div class="logo" style="margin:0 auto;width:56px;height:56px;font-size:26px;border-radius:16px">N</div>
    <h2>How can I help?</h2>
    <p>Ask anything, generate images, search the web, or attach a photo to analyze.</p>
    <div class="suggest">
      <div onclick="quick('Explain quantum computing simply')">🧠 Explain quantum computing simply</div>
      <div onclick="quick('Write a poem about the ocean')">✍️ Write a poem about the ocean</div>
      <div onclick="setMode('image');quick('A cat astronaut in space, digital art')">🎨 Generate an image</div>
      <div onclick="setMode('web');quick('Latest news in AI today')">🌐 Search the web</div>
    </div>
  </div>`;
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

/* Minimal markdown -> html */
function md(t){
  t=esc(t);
  t=t.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre><code>${c.replace(/^\n/,'')}</code></pre>`);
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  t=t.replace(/\*([^*]+)\*/g,'<i>$1</i>');
  t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/^### (.*)$/gm,'<b>$1</b>');
  t=t.replace(/^## (.*)$/gm,'<b>$1</b>');
  t=t.split(/\n{2,}/).map(p=>p.trim()?`<p>${p.replace(/\n/g,'<br>')}</p>`:'').join('');
  return t;
}

function addBubble(role, text, image, audio, animate=true){
  const box=document.getElementById('chat');
  if(box.querySelector('.welcome')) box.innerHTML='';
  const wrap=document.createElement('div');
  wrap.className='msg '+role;
  if(!animate) wrap.style.animation='none';
  let inner = role==='assistant' ? md(text||'') : esc(text||'').replace(/\n/g,'<br>');
  let media='';
  if(image) media+=`<img src="${image}">`;
  if(audio) media+=`<audio controls src="${audio}"></audio>`;
  const tools = role==='assistant' && text ?
    `<div class="tools">
       <button onclick="copyText(this)">📋 Copy</button>
       <button onclick="speak(this)">🔊 Read</button>
     </div>` : '';
  wrap.innerHTML=`
    <div class="avatar ${role}">${role==='assistant'?'N':'You'.slice(0,1)}</div>
    <div>
      <div class="bubble">${inner}${media}</div>
      ${tools}
    </div>`;
  wrap.dataset.raw=text||'';
  box.appendChild(wrap);
  scrollDown();
  return wrap;
}
function scrollDown(){const b=document.getElementById('chat');b.scrollTop=b.scrollHeight}

/* ---------- UI helpers ---------- */
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
function onKey(e){ if(e.key==='Enter' && !e.shiftKey){e.preventDefault();send()} }
function setMode(m){
  mode=m;
  document.getElementById('chipChat').classList.toggle('active',m==='chat');
  document.getElementById('chipWeb').classList.toggle('active',m==='web');
  document.getElementById('chipImage').classList.toggle('active',m==='image');
  const ph={chat:'Message Nova AI…',web:'Search the web…',image:'Describe an image to create…'};
  document.getElementById('input').placeholder=ph[m];
}
function quick(t){document.getElementById('input').value=t;send()}
function toggleDrawer(open){
  document.getElementById('drawer').classList.toggle('open',open);
  document.getElementById('overlay').classList.toggle('open',open);
}
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);
}
function copyText(btn){
  const raw=btn.closest('.msg').dataset.raw;
  navigator.clipboard.writeText(raw).then(()=>toast('Copied'));
}

/* ---------- File attach ---------- */
function onFile(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ attachedImage={dataUrl:r.result}; renderPreview(); };
  r.readAsDataURL(f);
  e.target.value='';
}
function renderPreview(){
  const p=document.getElementById('preview');
  p.innerHTML = attachedImage ?
    `<div class="thumb"><img src="${attachedImage.dataUrl}"><button class="x" onclick="clearImg()">×</button></div>`:'';
}
function clearImg(){attachedImage=null;renderPreview()}

/* ---------- Text-to-speech (button on messages) ---------- */
async function speak(btn){
  const raw=btn.closest('.msg').dataset.raw;
  const clean=raw.replace(/```[\s\S]*?```/g,' code block ').slice(0,1000);
  btn.textContent='⏳';
  try{
    const audio=await puter.ai.txt2speech(clean,{provider:'openai'});
    audio.play();
    btn.textContent='🔊 Read';
  }catch(err){ toast('TTS failed'); btn.textContent='🔊 Read'; }
}

/* ---------- Voice input (Web Speech API) ---------- */
let recog=null, listening=false;
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Voice not supported here');return}
  if(listening){recog.stop();return}
  recog=new SR();recog.lang='en-US';recog.interimResults=true;
  document.getElementById('micBtn').style.color='var(--danger)';
  listening=true;
  let final='';
  recog.onresult=e=>{
    let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;
    document.getElementById('input').value=t;autoGrow(document.getElementById('input'));
  };
  recog.onend=()=>{listening=false;document.getElementById('micBtn').style.color=''};
  recog.onerror=()=>{listening=false;document.getElementById('micBtn').style.color=''};
  recog.start();
}

/* ---------- Auth ---------- */
async function doAuth(){
  try{
    if(puter.auth.isSignedIn()){
      const u=await puter.auth.getUser();
      if(confirm(`Signed in as ${u.username}. Sign out?`)) { puter.auth.signOut(); updateAuth(); }
    }else{
      await puter.auth.signIn(); updateAuth();
    }
  }catch(e){}
}
async function updateAuth(){
  try{
    if(puter.auth.isSignedIn()){
      const u=await puter.auth.getUser();
      document.getElementById('loginBtn').textContent='✓';
      document.getElementById('statusLine').textContent='Signed in · '+u.username;
    }else{
      document.getElementById('loginBtn').textContent='👤';
    }
  }catch(e){}
}

/* ---------- Send / core logic ---------- */
async function send(){
  if(isStreaming) return;
  const input=document.getElementById('input');
  const text=input.value.trim();
  if(!text && !attachedImage) return;
  if(!currentId) newChat();

  const model=document.getElementById('model').value;
  const imgData = attachedImage ? attachedImage.dataUrl : null;

  // user bubble + store
  addBubble('user', text, imgData);
  curMsgs().push({role:'user', content:text, image:imgData});
  if(convos[currentId].title==='New chat' && text)
    convos[currentId].title = text.slice(0,40);
  save(); renderHist();

  input.value=''; autoGrow(input);
  const sendImg=attachedImage; clearImg();

  // ===== IMAGE GENERATION MODE =====
  if(mode==='image'){
    const w=addBubble('assistant','');
    w.querySelector('.bubble').innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
    isStreaming=true; document.getElementById('sendBtn').disabled=true;
    try{
      const imgEl=await puter.ai.txt2img(text,{model:'gpt-image-2'});
      const url=imgEl.src;
      w.querySelector('.bubble').innerHTML=`Here's your image:<img src="${url}">`;
      w.dataset.raw='[Generated image]';
      curMsgs().push({role:'assistant', content:"Here's your image:", image:url});
      save();
    }catch(err){
      w.querySelector('.bubble').textContent='⚠️ '+(err.message||'Image generation failed. Make sure you are signed in.');
    }
    isStreaming=false; document.getElementById('sendBtn').disabled=false; scrollDown();
    return;
  }

  // ===== CHAT / WEB / VISION MODE (streaming) =====
  const w=addBubble('assistant','');
  const bubble=w.querySelector('.bubble');
  bubble.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  isStreaming=true; document.getElementById('sendBtn').disabled=true;

  try{
    let response, full='';
    const opts={model, stream:true};
    if(mode==='web') opts.tools=[{type:'web_search'}];

    if(sendImg){
      // vision: pass prompt + image dataURL
      response=await puter.ai.chat(text||'What is in this image?', sendImg.dataUrl, opts);
      // some vision calls don't stream; handle both
    }else{
      // build conversation history for context
      const history=curMsgs().filter(m=>!m.image).map(m=>({role:m.role,content:m.content}));
      response=await puter.ai.chat(history, opts);
    }

    if(response && typeof response[Symbol.asyncIterator]==='function'){
      bubble.innerHTML='';
      for await(const part of response){
        const chunk = part?.text || '';
        if(chunk){ full+=chunk; bubble.innerHTML=md(full); scrollDown(); }
      }
    }else{
      // non-streamed result object
      full = response?.message?.content || response?.text || String(response);
      bubble.innerHTML=md(full);
    }

    if(!full) full='(no response)';
    w.dataset.raw=full;
    // add tools row
    if(!w.querySelector('.tools')){
      const t=document.createElement('div');t.className='tools';
      t.innerHTML=`<button onclick="copyText(this)">📋 Copy</button><button onclick="speak(this)">🔊 Read</button>`;
      bubble.parentElement.appendChild(t);
    }
    curMsgs().push({role:'assistant', content:full});
    save();
  }catch(err){
    bubble.innerHTML='⚠️ '+esc(err.message||'Request failed. Try signing in with the 👤 button.');
  }
  isStreaming=false; document.getElementById('sendBtn').disabled=false; scrollDown();
}
